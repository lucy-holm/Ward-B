name: Publish Godot build to itch.io

# THE GODOT PATH TO ITCH, DELIBERATELY GATED.
#
# Separate file from deploy-itch.yml on purpose. That workflow publishes the
# Three.js game on every push to `release`, and it is left completely
# untouched — so no branch push can ever ship the Godot build by accident.
# This one runs on manual dispatch ONLY.
#
# WHY THE GATE EXISTS — and why it is now inert but still here.
#
# This gate was written when the Godot port covered rooms 1-7 and the Three.js
# game covered 1-20: publishing Godot then would have taken 13 working rooms
# away from the audience. THAT IS NO LONGER TRUE. The Godot port has all 20
# rooms, the parity check below passes on its own, and as of 2026-08-23 the
# Godot build IS Ward B — see
# docs/superpowers/specs/2026-08-23-threejs-deprecation.md.
#
# The check stays anyway. It costs one `find` and it is the only automated
# thing standing between a bad merge and the public build. DO NOT DELETE IT ON
# THE GROUNDS THAT IT ALWAYS PASSES — that is precisely when a guard is doing
# its job.
#
# DEFAULT CHANNEL IS NOW THE PUBLIC ONE (`html5`), changed 2026-08-23 from
# `html5-godot`. It defaulted to the safe alongside-channel while Three.js was
# the game and this workflow was a testing convenience; now that Godot is the
# game, defaulting to anything else would mean the normal path published to a
# channel nobody plays. `html5-godot` is still available in the dropdown for
# exactly its original purpose: getting a build onto the project page for
# testing without touching what players load.
#
# TWO GUARDS REMAIN AND BOTH STILL APPLY: `confirm` must be typed as exactly
# "ship godot", and the parity check refuses `html5` if Godot ever drops below
# Three.js on room count. Neither is a formality.
#
# NOTE ON itch's PLAY BUTTON: a freshly created channel shows a download button
# until someone ticks "played in the browser" by hand — the runbook records
# this. It applies to `html5-godot`, not to `html5`, which is already set up.
#
# ONE-TIME SETUP: the BUTLER_API_KEY secret is already configured for
# deploy-itch.yml and is reused here. Nothing else to do.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "itch channel. html5 = the public playable build (default, Godot is the game). html5-godot = uploads alongside for testing."
        required: true
        default: html5
        type: choice
        options:
          - html5-godot
          - html5
      confirm:
        description: 'Type "ship godot" to confirm you meant to run this.'
        required: true
        default: ""
        type: string
      force_incomplete:
        description: "Allow publishing to the PUBLIC html5 channel while rooms are still missing. Leave unchecked."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Never let two butler uploads talk to itch's build servers at once, and
  # never cancel one mid-upload — same reasoning as deploy-itch.yml.
  group: itch-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4

      # Cheap guards first: fail before spending five minutes downloading
      # export templates for a run that was never going to be allowed.
      - name: Confirm intent
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "ship godot" ]; then
            echo "::error::confirm must be exactly 'ship godot' (got '${{ inputs.confirm }}')"
            exit 1
          fi

      - name: Parity check
        run: |
          set -euo pipefail
          # Source of truth for both counts is the filesystem, not a number
          # written in a comment that can rot.
          godot_rooms=$(find godot/rooms -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          three_rooms=$(ls src/rooms/room*.ts | wc -l | tr -d ' ')
          echo "Godot rooms:   $godot_rooms"
          echo "Three.js rooms: $three_rooms"

          if [ "${{ inputs.channel }}" != "html5" ]; then
            echo "Channel is '${{ inputs.channel }}' — not the public playable channel, parity not required."
            exit 0
          fi

          if [ "$godot_rooms" -ge "$three_rooms" ]; then
            echo "Parity reached ($godot_rooms >= $three_rooms) — clear to publish to html5."
            exit 0
          fi

          if [ "${{ inputs.force_incomplete }}" = "true" ]; then
            echo "::warning::Publishing to the PUBLIC channel with only $godot_rooms of $three_rooms rooms, because force_incomplete was set."
            exit 0
          fi

          echo "::error::Refusing to publish to the public html5 channel: Godot has $godot_rooms rooms, Three.js has $three_rooms. Players would lose $((three_rooms - godot_rooms)) rooms. Use channel html5-godot, or set force_incomplete if this is deliberate."
          exit 1

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -fSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          godot --version

      # THE ONLY PLACE A TELEMETRY ENDPOINT IS EVER COMPILED IN.
      #
      # godot/core/build_config.gd is committed EMPTY, so the Pages deploy,
      # the Helios/tailnet container and every local run produce a build with
      # no collector URL in it at all. This step is what makes the itch build
      # different, and it is deliberately not a reusable action or a shared
      # step — if you find yourself copying it into another workflow, that
      # workflow is about to start reporting Tom's own testing as player data.
      #
      # A second, independent gate lives in autoload/telemetry.gd: even with
      # this baked in, the build refuses to transmit unless it is actually
      # running on an itch host. See that file's header.
      - name: Bake the telemetry endpoint (itch only)
        env:
          TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TELEMETRY_URL:-}" ]; then
            echo "::error::The TELEMETRY_URL repo variable is empty. The public build would ship with telemetry silently disabled, which looks exactly like a healthy build until someone checks the dashboard weeks later. Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          godot/tools/write_build_config.sh "$TELEMETRY_URL" "$(git rev-parse --short HEAD)"
          # Ask the ENGINE what it resolved, rather than trusting the file the
          # shell just wrote. This catches a stale import cache and a bad
          # substitution, both of which produce a parseable file that simply
          # never reports — a failure mode indistinguishable from a healthy
          # build until someone checks the dashboard weeks later.
          godot --headless --path godot --import || true
          out=$(WARDB_EXPECT_ENDPOINT=1 godot --headless --path godot tools/check_build_config.tscn 2>&1)
          echo "$out"
          grep -q "OK - build config" <<<"$out" || {
            echo "::error::The engine did not resolve a baked telemetry endpoint."; exit 1; }

      - name: Export Godot web build
        run: |
          set -euo pipefail
          mkdir -p godot/build
          # A cold checkout has no .godot/ cache; exporting without importing
          # first ships an incomplete .pck. --import exits non-zero on import
          # warnings, which are not failures.
          godot --headless --path godot --import || true
          godot --headless --path godot --export-release "Web" build/index.html
          for f in index.html index.js index.wasm index.pck; do
            test -s "godot/build/$f" || { echo "::error::MISSING or empty: godot/build/$f"; exit 1; }
          done
          ls -lh godot/build

      - name: Install butler
        run: |
          set -euo pipefail
          # Same broth URL and the same two traps as deploy-itch.yml: the TLD
          # is itch.ZONE (itch.OVH is NXDOMAIN), and --fail keeps an HTTP
          # error from being written into butler.zip as an error page.
          curl -fSL --retry 3 --retry-delay 5 \
            -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          file butler.zip | grep -q 'Zip archive' \
            || { echo "::error::butler download was not a zip — has the broth URL changed?"; exit 1; }
          # butler resolves its sibling libs (7z.so, libc7zip.so) relative to
          # its own path, so the whole directory goes on PATH.
          unzip -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$PWD/butler-bin" >> "$GITHUB_PATH"

      - name: Verify butler
        run: butler -V

      - name: Push Godot build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          # Target is tommy-holmes/ward-b — the itch username is independent
          # of the GitHub owner (lucy-holm); do not "correct" it to match the
          # repo. Lowercased because itch canonicalises usernames that way.
          butler push godot/build "tommy-holmes/ward-b:${{ inputs.channel }}" \
            --userversion "godot-$(git rev-parse --short HEAD)-${{ github.run_number }}"

      - name: What to do next
        run: |
          echo "Pushed to channel '${{ inputs.channel }}'."
          if [ "${{ inputs.channel }}" != "html5" ]; then
            echo "This upload is NOT the browser-playable build. To try it in a browser on itch,"
            echo "open the project's Edit page and tick 'This file will be played in the browser'"
            echo "on the ${{ inputs.channel }} upload — then untick it again when you are done,"
            echo "or players will get the 7-room build."
          fi
