name: Publish Three.js build to itch.io [DEPRECATED — ROLLBACK ONLY]

# ============================================================================
# DEPRECATED 2026-08-23. THIS IS A ROLLBACK LEVER, NOT A PIPELINE.
#
# The Godot build is Ward B now. See
# docs/superpowers/specs/2026-08-23-threejs-deprecation.md for the decision and
# its reasoning; `deploy-itch-godot.yml` is what publishes the game.
#
# WHAT CHANGED HERE: the `on: push: branches: [release]` trigger was REMOVED.
# For a year this workflow shipped the public build automatically on every push
# to `release`, which is exactly why it has to be disabled rather than merely
# documented — leaving the trigger in place means the next person to merge into
# `release` silently republishes the Three.js game over the Godot one, and the
# first anyone knows about it is a player noticing the game looks different.
#
# WHEN TO RUN THIS: the Godot build has shipped to the public `html5` channel
# and is broken badly enough that reverting is better than fixing forward. That
# is the whole use case. Dispatch it manually and it will push the archived
# Three.js build back over the public channel.
#
# Everything below is otherwise UNCHANGED and still works. Do not "tidy" it —
# a rollback lever that has been refactored since it last ran is not a rollback
# lever.
#
# Original header follows.
# ---------------------------------------------------------------------------
# Staging pipeline: this workflow is completely separate from
# deploy.yml (Pages-on-main). It only runs on pushes to the `release`
# branch, so publishing to itch is always a deliberate second step —
# `main` alone never touches itch. See:
#   docs/superpowers/specs/2026-07-26-itch-release-runbook.md
#
# Release flow (also documented in the runbook):
#   git checkout release && git merge main && git push
#
# One-time manual itch.io setup this workflow CANNOT do for you —
# see the runbook's "Manual itch.io setup" section. Skipping it means
# the uploaded build shows a download button instead of a play button.
# ============================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Don't cancel a push already talking to itch's build servers mid-upload.
  group: itch-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Same build-metadata contract as deploy.yml (Pages). Keep the
          # two in sync if this ever changes.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}

      - name: Install butler
        run: |
          set -euo pipefail
          # broth.itch.ZONE — itch's own docs point CI here precisely because
          # these URLs are permanent (the itch.io download links expire).
          # Note the TLD: broth.itch.OVH is NXDOMAIN and produced a
          # "Could not resolve host" failure on the first release attempt.
          # --fail turns an HTTP error into a non-zero exit instead of
          # silently writing an error page to butler.zip and failing later
          # at unzip with something unrelated-looking.
          curl -fSL --retry 3 --retry-delay 5 \
            -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          # Sanity-check before unzipping so a future URL change fails here,
          # with an obvious message, rather than three steps downstream.
          file butler.zip | grep -q 'Zip archive' \
            || { echo "::error::butler download was not a zip — has the broth URL changed?"; exit 1; }
          # The archive is butler plus its sibling libs (7z.so, libc7zip.so);
          # butler resolves those relative to its own path, so the whole
          # directory goes on PATH, not just the binary.
          unzip -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$PWD/butler-bin" >> "$GITHUB_PATH"

      - name: Verify butler
        run: butler -V

      - name: Push build to itch.io
        env:
          # butler reads this env var directly — no `butler login` needed
          # in CI. Set as a GitHub Actions *secret* named BUTLER_API_KEY
          # (see the runbook for how to generate and add it).
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Target confirmed by Tom 2026-07-26: the project page is
          # https://Tommy-Holmes.itch.io/ward-b, so butler's target is
          # tommy-holmes/ward-b. (itch usernames are independent of the
          # GitHub account, which is lucy-holm — don't "correct" this to
          # match the repo owner. Lowercased because itch canonicalises
          # usernames that way; the display form preserves capitals.)
          butler push dist tommy-holmes/ward-b:html5 \
            --userversion "$(git rev-parse --short HEAD)-${{ github.run_number }}"
