name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Build metadata baked into the bundle (see vite.config.ts).
          VITE_BUILD_SHA: ${{ github.sha }}
          # NOTE: VITE_TELEMETRY_URL is deliberately NOT set here.
          #
          # Pages is the staging/playtest deployment — it's where Tom and
          # anyone he shares the link with poke at half-finished work, use
          # ?room= jumps, and replay rooms out of order. Telemetry is only
          # wanted from the real audience, so it is wired ONLY in
          # deploy-itch.yml (the release branch -> itch.io path).
          #
          # With the var unset, telemetry.ts falls back to console.log and
          # sends nothing over the network — no endpoint, no collection.
          # That's a stronger guarantee than tagging these sessions
          # env:'pages' and filtering them out downstream, because it can't
          # be forgotten in a query or a new insight.
          #
          # If you ever DO want Pages data, add the line back — the client
          # already distinguishes env:'pages' from env:'itch' on its own.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
