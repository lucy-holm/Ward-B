name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Build metadata baked into the bundle (see vite.config.ts).
          # VITE_TELEMETRY_URL is a public endpoint URL, not a secret — it
          # lives in a repo *variable*. If it's unset the game just logs
          # telemetry to console instead of failing the build.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
