# nginx config for the Godot web export (tailnet-only).
#
# Mounted into the ward-b-godot container at
# /etc/nginx/conf.d/default.conf. Lives in the game repo rather than ~/infra
# because it is a property of the Godot export, not of the machine.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot 4 web exports are served as .wasm; without the correct MIME type
    # WebAssembly.instantiateStreaming() refuses the response and the engine
    # falls back to a slower ArrayBuffer path (or fails outright on some
    # browsers). nginx's bundled mime.types covers this on modern versions,
    # but pin it explicitly so a base-image change cannot silently regress.
    types {
        application/wasm            wasm;
        application/octet-stream    pck;
        text/javascript             js;
        text/html                   html;
        image/png                   png;
        image/svg+xml               svg;
    }
    default_type application/octet-stream;

    # Serve the pre-compressed .gz produced by tools/deploy_tailnet.sh.
    # 38 MB -> 9.6 MB with zero per-request CPU. on-the-fly gzip of a 38 MB
    # wasm on every load would be a genuinely bad idea.
    gzip_static on;
    gzip_proxied any;

    # This build is NOT cross-origin isolated on purpose: it uses Godot's
    # no-threads template, so it needs neither SharedArrayBuffer nor
    # COOP/COEP. Sending those headers anyway would be harmless here but
    # would diverge from how itch.io will serve it, so we don't.

    location / {
        try_files $uri $uri/ /index.html;
        # A playtest build should never be stale. The wasm is content-hashed
        # by nothing, so revalidate every time rather than debug a cache.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
